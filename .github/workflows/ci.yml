name: CI

# The engine writes files that outlive the process, so the thing worth
# protecting is behaviour on damaged input, not just whether it assembles.
# Every job therefore builds and then runs the full storage test suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build
        run: sh build.sh

      - name: Test
        run: sh tests/run_tests.sh

      - name: COW core and fault-injection tests
        run: |
          sh build.sh --core-tests
          python3 tests/version_tests.py ./cyboudb
          python3 tests/compat_tests.py ./cyboudb
          python3 tests/root_roundtrip.py ./cyboudb
          python3 tests/integrity_tests.py ./cyboudb
          python3 tests/cow_tests.py ./cyboudb ./build/cow_harness
          python3 tests/bitmap_tests.py ./cyboudb ./build/cow_harness
          python3 tests/catalog_tests.py ./cyboudb ./build/cow_harness
          python3 tests/pax_tests.py ./cyboudb ./build/cow_harness
          python3 tests/pax_multi_tests.py ./cyboudb ./build/cow_harness
          sh build.sh --varlen-tests
          python3 tests/varlen_tests.py ./cyboudb ./build/varlen_harness
          sh build.sh --varlen-fragmentation-tests
          python3 tests/varlen_fragmentation_tests.py ./cyboudb ./build/varlen_fragmentation_harness
          python3 tests/varlen_sql_tests.py ./cyboudb
          python3 tests/vector_sql_tests.py ./cyboudb
          python3 tests/index_sql_tests.py ./cyboudb
          python3 tests/sql_tests.py ./cyboudb
          python3 tests/queue_sql_tests.py ./cyboudb
          python3 tests/stream_sql_tests.py ./cyboudb
          python3 tests/cross_primitive_crash_tests.py ./cyboudb
          python3 tests/transaction_tests.py ./cyboudb
          python3 tests/delete_tests.py ./cyboudb
          python3 tests/tombstone_tests.py ./cyboudb
          python3 tests/zone_tests.py ./cyboudb ./build/cow_harness
          python3 tests/zone_validation_tests.py ./cyboudb ./build/cow_harness
          python3 tests/span_tests.py ./cyboudb ./build/cow_harness
          python3 tests/concurrency_tests.py ./cyboudb ./build/cow_harness
          python3 tests/sql_numeric_tests.py ./cyboudb ./build/cow_harness
          sh build.sh --sql-tests
          python3 tests/zone_sql_tests.py ./cyboudb ./build/cow_harness ./build/sql_harness
          python3 tests/compression_integration_tests.py ./cyboudb ./build/cow_harness
          CybouDB_TEST_CREATE=create-compressed python3 tests/zone_sql_tests.py ./cyboudb ./build/cow_harness ./build/sql_harness
          python3 tests/sql_api_tests.py ./cyboudb ./build/sql_harness
          python3 tests/sql_pruning_tests.py ./cyboudb ./build/sql_harness
          python3 tests/sql_sink_tests.py ./cyboudb ./build/sql_harness
          sh build.sh --kernel-tests
          python3 tests/kernel_tests.py ./build/kernel_harness
          python3 tests/kernel_tests.py ./build/kernel_harness scalar
          sh build.sh --hardware-tests
          python3 tests/hardware_tests.py ./build/hardware_harness

      # The benchmark harness is built but not run: a timing number from a
      # shared CI runner is noise. Building it keeps it from rotting.
      - name: Build the benchmark harness
        run: |
          sh build.sh --bench
          sh build.sh --c-api-bench
          sh build.sh --vector-bench
          sh build.sh --queue-bench
          sh build.sh --flush-probe
          python3 tests/flush_range_tests.py ./build/flush_probe
          python3 tests/public_select_tests.py ./cyboudb ./build/bench_harness ./build/c_api_harness


      # A change-set too small to hold a transaction, so the path taken when
      # the log cannot be trusted is one the suites walk rather than one
      # nobody reaches. Inheritance has to switch itself off there: with the
      # log overflowing, segment visits per commit go back to 33 at depth
      # 2,000 from 1, and everything still has to pass.
      - name: The fallback taken when the change-set cannot be trusted
        run: |
          sh build.sh --cs-overflow
          sh tests/run_tests.sh ./build/cyboudb_overflow
          python3 tests/queue_sql_tests.py ./build/cyboudb_overflow
          python3 tests/stream_sql_tests.py ./build/cyboudb_overflow
          python3 tests/transaction_tests.py ./build/cyboudb_overflow
          python3 tests/delete_tests.py ./build/cyboudb_overflow
          python3 tests/cross_primitive_crash_tests.py ./build/cyboudb_overflow
          python3 tests/compat_tests.py ./build/cyboudb_overflow
          python3 tests/integrity_tests.py ./build/cyboudb_overflow

      # Built the way a release is built - `--lib`, no allocation injection -
      # and compiled in a directory holding only what a release ships. This is
      # the check that the published package links for somebody who has only
      # the package.
      - name: An application with only the published package
        run: |
          sh build.sh --lib
          rm -rf build/pkgtest && mkdir -p build/pkgtest/include
          cp include/cyboudb.h build/pkgtest/include/
          cp build/libcyboudb.a build/pkgtest/
          cp tests/package_consumer.c build/pkgtest/
          cd build/pkgtest
          cc -O2 -no-pie -Wall -Iinclude package_consumer.c libcyboudb.a -o consumer
          ./consumer

      - name: Build static library and run C API tests
        run: |
          sh build.sh --c-tests
          ./cyboudb create-large build/test_ci_varlen_c.cdb 10000 --force
          ./build/c_api_test build/test_ci_varlen_c.cdb varlen
          python3 tests/compress_tests.py ./build/compress_harness
          python3 tests/benchmark_profile_tests.py
          ./cyboudb create-pax-multi build/test_ci_c.cdb 10000 --force
          ./build/c_api_test build/test_ci_c.cdb
          ./cyboudb create-compressed build/test_ci_compressed_c.cdb 10000 --force
          ./build/c_api_test build/test_ci_compressed_c.cdb compressed
          ./cyboudb create-large build/test_ci_guard.cdb 10000 --force
          ./build/commit_guard_test build/test_ci_guard.cdb
          ./cyboudb create-tombstones build/test_ci_tomb.cdb 8000 --force
          ./cyboudb create-large build/test_ci_plain.cdb 8000 --force
          ./build/tombstone_layout_test build/test_ci_tomb.cdb build/test_ci_plain.cdb
          ./build/vector_topk_test
          ./cyboudb create-large build/test_ci_index.cdb 60000 --force
          ./build/index_tree_test build/test_ci_index.cdb
          ./cyboudb create-large build/test_ci_plan.cdb 20000 --force
          ./build/index_plan_test build/test_ci_plan.cdb
          ./cyboudb create-large build/test_ci_queue.cdb 4000 --force
          ./build/queue_page_test build/test_ci_queue.cdb
          ./cyboudb create-large build/test_ci_attack.cdb 4000 --force
          ./build/validator_attack_test build/test_ci_attack.cdb
          ./build/stream_page_test build/test_ci_queue.cdb
          ./build/queue_api_test build/test_ci_queue.cdb
          ./build/stream_api_test build/test_ci_queue.cdb
          ./cyboudb create-large build/test_ci_cross.cdb 4000 --force
          ./build/cross_primitive_test build/test_ci_cross.cdb
          ./cyboudb create-large build/test_ci_rerun.cdb 8000 --force
          ./build/prepared_rerun_test build/test_ci_rerun.cdb
          ./cyboudb create-large build/test_ci_bind.cdb 20000 --force
          ./build/bind_test build/test_ci_bind.cdb
          ./cyboudb create-leases build/test_ci_leased.cdb 4000 --force
          ./cyboudb create-large build/test_ci_plainq.cdb 4000 --force
          ./build/lease_state_test build/test_ci_leased.cdb build/test_ci_plainq.cdb
          ./cyboudb create-leases build/test_ci_ops.cdb 4000 --force
          ./build/lease_ops_test build/test_ci_ops.cdb
          sh build.sh --vector-example
          ./build/vector_search_example
          sh build.sh --worker-example
          ./build/worker_example

      # A capability bit is a promise to builds that already exist, and the
      # only part of it this repository can hold itself to is the refusal.
      # --no-leases is a reader with the bit dropped from what it knows,
      # which is what every released 0.5 binary is.
      - name: An older reader refuses a newer file
        run: |
          sh build.sh --no-leases
          python3 tests/lease_format_tests.py ./cyboudb ./build/cyboudb_nolease
          python3 tests/lease_sql_tests.py ./cyboudb

      - name: Interactive REPL and pipe tests
        run: python3 tests/repl_tests.py ./cyboudb

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        run: choco install nasm -y --no-progress

      # build.bat finds NASM and the MSVC linker on its own, so no
      # Developer Command Prompt and no PATH juggling is needed here.
      - name: Build
        shell: cmd
        # Reproduce the GNU link.exe PATH collision from the original failure.
        run: |
          set "PATH=C:\Program Files\Git\usr\bin;%PATH%"
          call build.bat

      - name: Test
        shell: bash
        run: sh tests/run_tests.sh

      - name: Build COW and SQL test drivers
        shell: cmd
        run: |
          call build.bat --core-tests
          if errorlevel 1 exit /b 1
          call build.bat --sql-tests
          if errorlevel 1 exit /b 1
          call build.bat --kernel-tests
          if errorlevel 1 exit /b 1
          call build.bat --hardware-tests
          if errorlevel 1 exit /b 1
          call build.bat --varlen-tests
          if errorlevel 1 exit /b 1
          call build.bat --varlen-fragmentation-tests
          if errorlevel 1 exit /b 1

      - name: COW core and fault-injection tests
        shell: bash
        run: |
          python tests/version_tests.py ./cyboudb.exe
          python tests/compat_tests.py ./cyboudb.exe
          python tests/root_roundtrip.py ./cyboudb.exe
          python tests/integrity_tests.py ./cyboudb.exe
          python tests/cow_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/bitmap_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/catalog_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/pax_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/pax_multi_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/varlen_tests.py ./cyboudb.exe ./build/varlen_harness.exe
          python tests/varlen_fragmentation_tests.py ./cyboudb.exe ./build/varlen_fragmentation_harness.exe
          python tests/varlen_sql_tests.py ./cyboudb.exe
          python tests/vector_sql_tests.py ./cyboudb.exe
          python tests/index_sql_tests.py ./cyboudb.exe
          python tests/sql_tests.py ./cyboudb.exe
          python tests/queue_sql_tests.py ./cyboudb.exe
          python tests/stream_sql_tests.py ./cyboudb.exe
          python tests/cross_primitive_crash_tests.py ./cyboudb.exe
          python tests/transaction_tests.py ./cyboudb.exe
          python tests/delete_tests.py ./cyboudb.exe
          python tests/tombstone_tests.py ./cyboudb.exe
          python tests/cmdline_tests.py ./cyboudb.exe
          python tests/zone_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/zone_validation_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/span_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/concurrency_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/sql_numeric_tests.py ./cyboudb.exe ./build/cow_harness.exe
          python tests/sql_api_tests.py ./cyboudb.exe ./build/sql_harness.exe
          python tests/zone_sql_tests.py ./cyboudb.exe ./build/cow_harness.exe ./build/sql_harness.exe
          python tests/compression_integration_tests.py ./cyboudb.exe ./build/cow_harness.exe
          CybouDB_TEST_CREATE=create-compressed python tests/zone_sql_tests.py ./cyboudb.exe ./build/cow_harness.exe ./build/sql_harness.exe
          python tests/sql_pruning_tests.py ./cyboudb.exe ./build/sql_harness.exe
          python tests/sql_sink_tests.py ./cyboudb.exe ./build/sql_harness.exe
          python tests/kernel_tests.py ./build/kernel_harness.exe
          python tests/kernel_tests.py ./build/kernel_harness.exe scalar
          python tests/hardware_tests.py ./build/hardware_harness.exe

      - name: Build the benchmark harness
        shell: cmd
        run: |
          call build.bat --bench
          if errorlevel 1 exit /b 1
          call build.bat --c-api-bench
          if errorlevel 1 exit /b 1
          call build.bat --vector-bench
          if errorlevel 1 exit /b 1
          call build.bat --queue-bench
          if errorlevel 1 exit /b 1
          call build.bat --flush-probe
          if errorlevel 1 exit /b 1
          python tests/flush_range_tests.py ./build/flush_probe.exe
          python tests/public_select_tests.py ./cyboudb.exe ./build/bench_harness.exe ./build/c_api_harness.exe


      # A change-set too small to hold a transaction, so the fallback taken
      # when the log cannot be trusted is a path the suites walk. Built in cmd
      # like every other build here, and driven from bash, because `cmd //c`
      # out of bash has failed quietly on this runner before.
      - name: Build with a change-set that overflows
        shell: cmd
        run: |
          call build.bat --cs-overflow
          if errorlevel 1 exit /b 1

      - name: The fallback taken when the change-set cannot be trusted
        shell: bash
        run: |
          sh tests/run_tests.sh ./build/cyboudb_overflow.exe
          python tests/queue_sql_tests.py ./build/cyboudb_overflow.exe
          python tests/stream_sql_tests.py ./build/cyboudb_overflow.exe
          python tests/transaction_tests.py ./build/cyboudb_overflow.exe
          python tests/cross_primitive_crash_tests.py ./build/cyboudb_overflow.exe
          python tests/compat_tests.py ./build/cyboudb_overflow.exe
          python tests/integrity_tests.py ./build/cyboudb_overflow.exe

      - name: An application with only the published package
        shell: cmd
        run: |
          call build.bat --lib
          if errorlevel 1 exit /b 1
          if exist build\pkgtest rmdir /s /q build\pkgtest
          mkdir build\pkgtest\include
          copy include\cyboudb.h build\pkgtest\include\ >nul
          copy build\cyboudb.lib build\pkgtest\ >nul
          copy tests\package_consumer.c build\pkgtest\ >nul
          rem build.bat runs vcvars64 inside its own setlocal, so nothing it set
          rem reaches us here. This step compiles C itself and has to find MSVC
          rem for itself, exactly the way tools\package.bat does.
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH echo error: MSVC not found & exit /b 1
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul 2>&1
          cd build\pkgtest
          cl.exe /O2 /W3 /nologo /Iinclude package_consumer.c /Fe:consumer.exe /Fo:consumer.obj /link cyboudb.lib kernel32.lib
          if errorlevel 1 exit /b 1
          .\consumer.exe
          if errorlevel 1 exit /b 1

      - name: Build static library and run C API tests
        shell: cmd
        run: |
          call build.bat --c-tests
          if errorlevel 1 exit /b 1
          cyboudb.exe create-large build\test_ci_varlen_c.cdb 10000 --force
          if errorlevel 1 exit /b 1
          build\c_api_test.exe build\test_ci_varlen_c.cdb varlen
          if errorlevel 1 exit /b 1
          python tests/compress_tests.py ./build/compress_harness.exe
          if errorlevel 1 exit /b 1
          python tests/benchmark_profile_tests.py
          if errorlevel 1 exit /b 1
          cyboudb.exe create-pax-multi build\test_ci_c.cdb 10000 --force
          build\c_api_test.exe build\test_ci_c.cdb
          if errorlevel 1 exit /b 1
          cyboudb.exe create-compressed build\test_ci_compressed_c.cdb 10000 --force
          build\c_api_test.exe build\test_ci_compressed_c.cdb compressed
          if errorlevel 1 exit /b 1
          build\vector_topk_test.exe
          if errorlevel 1 exit /b 1
          cyboudb.exe create-large build\test_ci_guard.cdb 10000 --force
          if errorlevel 1 exit /b 1
          build\commit_guard_test.exe build\test_ci_guard.cdb
          if errorlevel 1 exit /b 1
          cyboudb.exe create-tombstones build\test_ci_tomb.cdb 8000 --force
          if errorlevel 1 exit /b 1
          cyboudb.exe create-large build\test_ci_plain.cdb 8000 --force
          if errorlevel 1 exit /b 1
          build\tombstone_layout_test.exe build\test_ci_tomb.cdb build\test_ci_plain.cdb
          if errorlevel 1 exit /b 1
          cyboudb.exe create-large build\test_ci_index.cdb 60000 --force
          if errorlevel 1 exit /b 1
          build\index_tree_test.exe build\test_ci_index.cdb
          if errorlevel 1 exit /b 1
          cyboudb.exe create-large build\test_ci_plan.cdb 20000 --force
          if errorlevel 1 exit /b 1
          build\index_plan_test.exe build\test_ci_plan.cdb
          if errorlevel 1 exit /b 1
          cyboudb.exe create-large build\test_ci_queue.cdb 4000 --force
          if errorlevel 1 exit /b 1
          build\queue_page_test.exe build\test_ci_queue.cdb
          if errorlevel 1 exit /b 1
          cyboudb.exe create-large build\test_ci_attack.cdb 4000 --force
          if errorlevel 1 exit /b 1
          build\validator_attack_test.exe build\test_ci_attack.cdb
          build\stream_page_test.exe build\test_ci_queue.cdb
          if errorlevel 1 exit /b 1
          build\queue_api_test.exe build\test_ci_queue.cdb
          build\stream_api_test.exe build\test_ci_queue.cdb
          cyboudb.exe create-large build\test_ci_cross.cdb 4000 --force
          build\cross_primitive_test.exe build\test_ci_cross.cdb
          cyboudb.exe create-large build\test_ci_rerun.cdb 8000 --force
          build\prepared_rerun_test.exe build\test_ci_rerun.cdb
          if errorlevel 1 exit /b 1
          cyboudb.exe create-large build\test_ci_bind.cdb 20000 --force
          if errorlevel 1 exit /b 1
          build\bind_test.exe build\test_ci_bind.cdb
          if errorlevel 1 exit /b 1
          cyboudb.exe create-leases build\test_ci_leased.cdb 4000 --force
          if errorlevel 1 exit /b 1
          cyboudb.exe create-large build\test_ci_plainq.cdb 4000 --force
          if errorlevel 1 exit /b 1
          build\lease_state_test.exe build\test_ci_leased.cdb build\test_ci_plainq.cdb
          if errorlevel 1 exit /b 1
          cyboudb.exe create-leases build\test_ci_ops.cdb 4000 --force
          if errorlevel 1 exit /b 1
          build\lease_ops_test.exe build\test_ci_ops.cdb
          if errorlevel 1 exit /b 1
          call build.bat --vector-example
          if errorlevel 1 exit /b 1
          build\vector_search_example.exe
          if errorlevel 1 exit /b 1
          call build.bat --worker-example
          build\worker_example.exe
          if errorlevel 1 exit /b 1

      # Split the way the other two-binary steps are: the build under cmd, the
      # run under bash, because `cmd //c` from bash has failed silently here
      # before.
      - name: Build a reader that does not know the leases bit
        shell: cmd
        run: |
          call build.bat --no-leases
          if errorlevel 1 exit /b 1

      - name: An older reader refuses a newer file
        shell: bash
        run: |
          python tests/lease_format_tests.py ./cyboudb.exe ./build/cyboudb_nolease.exe
          python tests/lease_sql_tests.py ./cyboudb.exe

      - name: Interactive REPL and pipe tests
        shell: bash
        run: python tests/repl_tests.py ./cyboudb.exe

  ascii:
    name: Source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ARG1..ARG6 are macros over two calling conventions that disagree
      # about which machine register each one is, so writing one argument
      # can destroy another that has not been read yet. It reads correctly
      # on one platform and passes the wrong value on the other, which is
      # why a machine reads it rather than a person. See the lint itself.
      - name: No argument register is read after another argument took it
        run: python3 tests/abi_arg_lint.py

      # The neighbour of that mistake: rdi and rsi are arguments on Linux and
      # the caller's registers on Windows, so a loop that uses one as an index
      # is free in one build and corrupts its caller in the other. It cost a
      # crash with no failing assertion near it - see the lint itself.
      - name: No callee-saved register is written without being saved
        run: python3 tests/abi_nonvolatile_lint.py

      # Comments, strings and scripts are English ASCII by convention. A .bat
      # file is the practical reason: cmd.exe reads it in the console code
      # page, where non-ASCII bytes corrupt parsing outright.
      - name: Reject non-ASCII bytes
        run: |
          if LC_ALL=C grep -rnP '[^\x00-\x7F]|[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' \
               --include='*.asm' --include='*.inc' --include='*.sh' \
               --include='*.bat' --include='*.py' --include='*.yml' \
               --include='*.c' --include='*.h' .; then
            echo "::error::non-ASCII bytes found in the files listed above"
            exit 1
          fi
          echo "all sources are pure ASCII"
          if LC_ALL=C grep -rnP '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' --include='*.md' benchmarks/results; then
            echo "::error::control characters in benchmark reports"
            exit 1
          fi
