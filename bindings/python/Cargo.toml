[package]
name = "cyboudb-py"
version = "0.5.0"
edition = "2021"
authors = ["Stanislav Saveliev", "CybouDB Contributors"]
license = "Apache-2.0"
description = "Python bindings for the CybouDB embedded database engine"

[lib]
name = "cyboudb"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
cyboudb-core = { package = "cyboudb", path = "../rust/cyboudb" }
cyboudb-sys = { path = "../rust/cyboudb-sys" }
